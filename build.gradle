tasks.register("build1211") {
    group = "build"
    description = "Builds Fabric and NeoForge mods for Minecraft 1.21.1"
    dependsOn gradle.includedBuild("1.21.1").task(":fabric:build")
    dependsOn gradle.includedBuild("1.21.1").task(":neoforge:build")
}

tasks.register("build1214") {
    group = "build"
    description = "Builds Fabric and NeoForge mods for Minecraft 1.21.4"
    dependsOn gradle.includedBuild("1.21.4").task(":fabric:build")
    dependsOn gradle.includedBuild("1.21.4").task(":neoforge:build")
}

tasks.register("build") {
    group = "build"
    description = "Builds all supported Minecraft versions"
    dependsOn tasks.named("build1211")
    dependsOn tasks.named("build1214")
}

tasks.register("copyJars") {
    group = "build"
    description = "Copies built jars to the root /builds directory with clear version labels"
    dependsOn tasks.named("build")
    doLast {
        def outDir = file("builds")
        outDir.mkdirs()
        copy {
            from "1.21.1/fabric/build/libs/minecraft-mcp-server-fabric-1.0.0.jar"
            into outDir
            rename { "minecraft-mcp-server-fabric-1.21.1.jar" }
        }
        copy {
            from "1.21.1/neoforge/build/libs/minecraft-mcp-server-neoforge-1.0.0.jar"
            into outDir
            rename { "minecraft-mcp-server-neoforge-1.21.1.jar" }
        }
        copy {
            from "1.21.4/fabric/build/libs/minecraft-mcp-server-fabric-1.0.0.jar"
            into outDir
            rename { "minecraft-mcp-server-fabric-1.21.4.jar" }
        }
        copy {
            from "1.21.4/neoforge/build/libs/minecraft-mcp-server-neoforge-1.0.0.jar"
            into outDir
            rename { "minecraft-mcp-server-neoforge-1.21.4.jar" }
        }
        println "[Minecraft-MCP] All version JARs copied to builds/"
    }
}
